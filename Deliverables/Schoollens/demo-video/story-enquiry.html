<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Parent enquiry</title>
  <style>
    html, body { margin: 0; height: 100%; background: #001f44; color: #fff; font-family: "Segoe UI", sans-serif; }
    .wrap { display: grid; grid-template-columns: 1fr 1.05fr; height: 100%; }
    .copy { padding: 56px 48px; }
    .kicker { color: #38a39a; letter-spacing: .16em; font-size: 13px; font-weight: 700; text-transform: uppercase; }
    h1 { font-family: Georgia, serif; font-size: 38px; line-height: 1.2; margin: 16px 0 18px; max-width: 16ch; }
    p { font-size: 20px; line-height: 1.45; color: #c8d8d4; max-width: 34ch; }
    .shot { overflow: hidden; background: #111; }
    .shot img { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="copy">
      <p class="kicker">International School Review Myanmar · 23 minutes ago</p>
      <h1>A parent asked: Yangon American or KINGS?</h1>
      <p>They compared fees in the comments. Facebook answered with 84% recommended versus not yet rated.</p>
    </div>
    <div class="shot">
      <img src="parent-yais-kings.png" alt="Parent Facebook enquiry" />
    </div>
  </div>
</body>
</html>
